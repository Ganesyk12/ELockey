# ELockey — config nginx (dipakai sebagai container nginx)
#
# Setup manual di VPS (nginx container):
#   · conf ini di-mount ke /etc/nginx/conf.d/elockey.conf di dalam container
#   · FE static : host /var/www/html/elockey  ->  /usr/share/nginx/html/elockey (ro)
#     (hasil web/dist di-copy ke /var/www/html/elockey/)
#   · Backend   : container BE (`app` dari docker-compose) di docker network
#     yang sama. Kalau nama service/container-mu beda, sesuaikan proxy_pass-nya.
#
# Contoh (docker compose untuk nginx):
#   services:
#     nginx:
#       image: nginx:alpine
#       ports: ["80:80"]
#       volumes:
#         - ./deploy/nginx-elockey.conf:/etc/nginx/conf.d/elockey.conf:ro
#         - /var/www/html/elockey:/usr/share/nginx/html/elockey:ro
#       networks: [elockey]

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html/elockey;
    index index.html;

    # SPA fallback: semua rute FE fallback ke index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API ke backend (container BE = `app`, port 5655)
    location /api/ {
        proxy_pass http://app:5655;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Aset statis yang di-hash Vite — cache lama di browser
    location ~* \.(js|css|svg|woff2?|png|jpg|jpeg|gif|ico|webp)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html jangan di-cache biar update langsung ke client
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}